<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAM Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d1020'/><path d='M6 22 A12 12 0 0 1 26 22' fill='none' stroke='%23223' stroke-width='3.5' stroke-linecap='round'/><path d='M6 22 A12 12 0 0 1 22.4 11.5' fill='none' stroke='%232e74d4' stroke-width='3.5' stroke-linecap='round'/><circle cx='22.4' cy='11.5' r='2.2' fill='%232e74d4'/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Tokens: dark ── */
:root {
  --bg:            oklch(13.5% 0.015 245);
  --surface:       oklch(18%   0.015 245);
  --surface-hi:    oklch(22%   0.016 245);
  --border:        oklch(26%   0.018 245);
  --text:          oklch(92%   0.006 245);
  --text-dim:      oklch(52%   0.010 245);
  --text-faint:    oklch(34%   0.012 245);

  --safe-kill:     oklch(62%   0.22  22);
  --auto-restart:  oklch(73%   0.17  58);
  --system:        oklch(68%   0.18 145);  /* green: used for pressure-normal + conn-dot only */
  --neutral:       oklch(52%   0.008 245); /* muted: system badge — not actionable */
  --active:        oklch(60%   0.22 238);
  --wired:         oklch(57%   0.20 282);
  --compressed:    oklch(64%   0.20  44);
  --free:          oklch(30%   0.014 245);
  --track:         oklch(20%   0.012 245);

  --row-hover:     oklch(22%   0.015 245 / 0.7);
  --radius:        12px;
  --font-display:  'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-body:     -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
}

/* ── Tokens: light ── */
[data-theme="light"] {
  --bg:            oklch(95%   0.008  78);
  --surface:       oklch(99.5% 0.003  78);
  --surface-hi:    oklch(97%   0.005  78);
  --border:        oklch(88%   0.010  78);
  --text:          oklch(16%   0.008 245);
  --text-dim:      oklch(50%   0.008 245);
  --text-faint:    oklch(72%   0.006  78);

  --safe-kill:     oklch(48%   0.22  22);
  --auto-restart:  oklch(52%   0.18  58);
  --system:        oklch(42%   0.18 145);
  --neutral:       oklch(46%   0.006 245);
  --active:        oklch(46%   0.22 238);
  --wired:         oklch(43%   0.20 282);
  --compressed:    oklch(50%   0.20  44);
  --free:          oklch(78%   0.008  78);
  --track:         oklch(91%   0.007  78);

  --row-hover:     oklch(94%   0.006  78 / 0.8);
}

/* ── Base ── */
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
  transition: background 240ms ease, color 240ms ease;
}

.shell {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ── Header card ── */
header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 26px;
  display: flex;
  align-items: center;
  gap: 26px;
  transition: background 240ms ease, border-color 240ms ease;
}

/* ── Gauge block ── */
.gauge-block {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.wordmark {
  font-family: var(--font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-faint);
  user-select: none;
}

.gauge-wrap {
  position: relative;
  width: 190px;
  height: 190px;
}

#gauge-canvas { display: block; }

.gauge-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -42%);
  text-align: center;
  pointer-events: none;
  user-select: none;
}

#gauge-pct {
  display: block;
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  color: var(--text);
}

.gauge-unit {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ── Stats area ── */
.stats-area {
  flex: 1;
  display: flex;
  align-items: stretch;
  min-width: 0;
}

.stat-section {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 26px;
  gap: 6px;
}

.stat-section:first-child { padding-left: 0; }

.stat-section + .stat-section {
  border-left: 1px solid var(--border);
}

.stat-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* Hero Used */
.stat-hero-row {
  display: flex;
  align-items: baseline;
  gap: 4px;
  transition: color 300ms ease;
}

.stat-hero-num {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 700;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.stat-hero-unit {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 500;
  color: var(--text-dim);
  letter-spacing: -0.01em;
}

/* Secondary pair */
.stat-pair { display: flex; flex-direction: column; gap: 7px; }

.stat-mini { display: flex; align-items: baseline; gap: 6px; }

.stat-mini-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  width: 34px;
}

.stat-mini-val {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}

.stat-mini-unit { font-size: 12px; color: var(--text-dim); }

/* Pressure pill */
.pressure-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 600;
  transition: background 300ms ease, color 300ms ease;
  white-space: nowrap;
}

.pressure-pill::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

.pressure-normal   { color: var(--system);      background: color-mix(in oklch, var(--system)      12%, transparent); }
.pressure-warn     { color: var(--auto-restart); background: color-mix(in oklch, var(--auto-restart) 14%, transparent); }
.pressure-critical { color: var(--safe-kill);    background: color-mix(in oklch, var(--safe-kill)   14%, transparent); }

/* Freeable */
.stat-freeable-row {
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.stat-freeable-num {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  color: var(--safe-kill);
  transition: color 300ms ease;
}

.stat-freeable-unit {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 500;
  color: color-mix(in oklch, var(--safe-kill) 55%, var(--text-dim));
  transition: color 300ms ease;
}

.stat-freeable-row.none .stat-freeable-num { color: var(--text-faint); }
.stat-freeable-row.none .stat-freeable-unit { color: var(--text-faint); }

/* ── Header right ── */
.header-right {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 10px;
  align-self: center;
  min-width: 148px;
}

/* Batch kill — solid fill when active, recedes when disabled */
.btn-batch {
  background: var(--safe-kill);
  color: oklch(97% 0.006 22);
  border: none;
  padding: 11px 18px;
  border-radius: 9px;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 150ms, opacity 150ms;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
}

.btn-batch:hover:not(:disabled) {
  background: oklch(66% 0.22 22);
}

.btn-batch:disabled {
  background: transparent;
  color: var(--text-faint);
  border: 1px solid var(--border);
  cursor: not-allowed;
}

.btn-batch kbd {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 4px;
  font-size: 9px;
  font-family: var(--font-body);
  font-weight: 700;
  letter-spacing: 0.04em;
  background: oklch(55% 0.22 22 / 0.35);
  color: oklch(92% 0.006 22);
  border: 1px solid oklch(52% 0.20 22 / 0.4);
}

.btn-batch:disabled kbd {
  background: color-mix(in oklch, var(--text-faint) 10%, transparent);
  color: var(--text-faint);
  border-color: var(--border);
}

/* Theme toggle + conn status sit together, separated from batch kill */
.header-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.theme-btn {
  width: 30px;
  height: 30px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-dim);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: background 150ms, border-color 150ms, color 150ms;
  flex-shrink: 0;
}

.theme-btn:hover { color: var(--text); }

/* Focus rings for keyboard users */
:focus-visible {
  outline: 2px solid var(--active);
  outline-offset: 2px;
}

.conn-status {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}

.conn-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--system);
  transition: background 300ms;
  flex-shrink: 0;
}
.conn-dot.warn  { background: var(--auto-restart); }
.conn-dot.error { background: var(--safe-kill); }

/* ── Process table ── */
.table-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: background 240ms ease, border-color 240ms ease;
}

table { width: 100%; border-collapse: collapse; }

thead th {
  padding: 10px 14px;
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--text-dim);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  background: var(--surface-hi);
}

tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background 120ms ease;
  cursor: default;
  will-change: transform, opacity;
}

tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--row-hover); }

td {
  padding: 10px 14px;
  vertical-align: middle;
  white-space: nowrap;
}

.col-name {
  font-weight: 500;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.col-ram { min-width: 160px; }

.col-meta {
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}

.meta-sep { margin: 0 4px; color: var(--text-faint); }

.col-actions { min-width: 160px; }

/* RAM bar */
.ram-bar-wrap { display: flex; align-items: center; gap: 8px; }

.ram-bar-bg {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.ram-bar-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--active);
  transition: width 600ms ease;
}

.ram-label {
  font-size: 12px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  min-width: 52px;
  text-align: right;
}

/* Badges */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* /colorize fix: system badge uses --neutral (muted), not green.
   Green (--system) is reserved for pressure-normal and conn-dot. */
.badge-safe    { background: color-mix(in oklch, var(--safe-kill)    14%, transparent); color: var(--safe-kill); }
.badge-restart { background: color-mix(in oklch, var(--auto-restart) 14%, transparent); color: var(--auto-restart); }
.badge-system  { background: color-mix(in oklch, var(--neutral)      14%, transparent); color: var(--neutral); }

/* Action buttons */
.btn {
  display: inline-flex;
  align-items: center;
  padding: 4px 11px;
  border-radius: 6px;
  border: 1px solid transparent;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  background: none;
  color: inherit;
  transition: background 120ms ease;
  letter-spacing: 0.02em;
}

.btn-kill {
  border-color: color-mix(in oklch, var(--safe-kill) 32%, transparent);
  color: var(--safe-kill);
  background: color-mix(in oklch, var(--safe-kill) 6%, transparent);
}
.btn-kill:hover { background: color-mix(in oklch, var(--safe-kill) 14%, transparent); }

.btn-restart {
  border-color: color-mix(in oklch, var(--auto-restart) 32%, transparent);
  color: var(--auto-restart);
  background: color-mix(in oklch, var(--auto-restart) 6%, transparent);
  margin-left: 5px;
}
.btn-restart:hover { background: color-mix(in oklch, var(--auto-restart) 14%, transparent); }

.btn-kill-err {
  font-size: 10px;
  color: var(--safe-kill);
  margin-left: 6px;
  font-weight: 500;
}

.empty-cell {
  padding: 48px;
  text-align: center;
  color: var(--text-dim);
}

/* Kill flash animation */
@keyframes row-flash {
  0%, 100% { background: transparent; }
  35%       { background: color-mix(in oklch, var(--safe-kill) 10%, transparent); }
}
.row-flash { animation: row-flash 320ms ease; }

/* ── Toast — top-right, near batch kill button ── */
#toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 999;
  pointer-events: none;
}

.toast {
  background: var(--surface-hi);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 12px;
  color: var(--text);
  box-shadow: 0 4px 20px oklch(0% 0 0 / 0.3);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
  }
}
</style>
</head>
<body>
<div class="shell">

<header>
  <div class="gauge-block">
    <span class="wordmark">RAM Watch</span>
    <div class="gauge-wrap">
      <!-- role+aria-label updated each SSE tick with full segment breakdown -->
      <canvas id="gauge-canvas" width="190" height="190"
              role="img" aria-label="Memory gauge: loading"></canvas>
      <div class="gauge-center">
        <span id="gauge-pct">—</span>
        <span class="gauge-unit">used</span>
      </div>
    </div>
  </div>

  <div class="stats-area">
    <div class="stat-section">
      <span class="stat-label">Used</span>
      <div class="stat-hero-row" id="s-used-row">
        <span class="stat-hero-num" id="s-used-num">—</span>
        <span class="stat-hero-unit">GB</span>
      </div>
    </div>

    <div class="stat-section">
      <div class="stat-pair">
        <div class="stat-mini">
          <span class="stat-mini-label">Free</span>
          <span class="stat-mini-val" id="s-free">—</span>
          <span class="stat-mini-unit">GB</span>
        </div>
        <div class="stat-mini">
          <span class="stat-mini-label">Total</span>
          <span class="stat-mini-val" id="s-total">—</span>
          <span class="stat-mini-unit">GB</span>
        </div>
      </div>
    </div>

    <div class="stat-section">
      <span class="stat-label">Pressure</span>
      <span id="pressure-pill" class="pressure-pill pressure-normal">Normal</span>
    </div>

    <div class="stat-section">
      <span class="stat-label">Freeable</span>
      <div class="stat-freeable-row none" id="s-freeable-row">
        <span class="stat-freeable-num" id="s-freeable-num">—</span>
        <span class="stat-freeable-unit">GB</span>
      </div>
    </div>
  </div>

  <div class="header-right">
    <!-- Primary action: solid fill, full-width, F shortcut -->
    <button id="batch-kill-btn" class="btn-batch" onclick="batchKill()" disabled
            aria-label="Kill all safe-to-kill processes (F)">
      Free <span id="batch-gb">—</span> GB <kbd>F</kbd>
    </button>
    <div class="header-controls">
      <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg id="theme-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <div class="conn-status" aria-live="polite" aria-atomic="true">
        <span class="conn-dot" id="conn-dot"></span>
        <span id="conn-label">—</span>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Process</th>
          <th>RAM</th>
          <th>Meta</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="proc-body" aria-live="polite" aria-label="Running processes">
        <tr><td colspan="5" class="empty-cell">Connecting…</td></tr>
      </tbody>
    </table>
  </div>
</main>

</div>

<div id="toast-container" aria-live="assertive" aria-atomic="true"></div>

<script>
// ── Theme ──────────────────────────────────────────────────────────────────
const html   = document.documentElement;
const gaugeCanvas = document.getElementById('gauge-canvas');

const MOON = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
const SUN  = `<circle cx="12" cy="12" r="5"/>
  <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
  <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;

function cssColorToHex(varName) {
  const el = document.createElement('div');
  el.style.cssText = `color:var(${varName});position:absolute;visibility:hidden;pointer-events:none`;
  document.body.appendChild(el);
  const rgb = getComputedStyle(el).color;
  document.body.removeChild(el);
  const m = rgb.match(/\d+/g);
  if (!m || m.length < 3) return 0x888888;
  return (parseInt(m[0]) << 16) | (parseInt(m[1]) << 8) | parseInt(m[2]);
}

function buildPalette() {
  return {
    active:     cssColorToHex('--active'),
    wired:      cssColorToHex('--wired'),
    compressed: cssColorToHex('--compressed'),
    free:       cssColorToHex('--free'),
    track:      cssColorToHex('--track'),
  };
}

let gaugeReady    = false;
let currentPalette = null;

function applyTheme(theme) {
  html.setAttribute('data-theme', theme);
  document.getElementById('theme-icon').innerHTML = theme === 'dark' ? MOON : SUN;
  localStorage.setItem('rw-theme', theme);
  if (gaugeReady) {
    currentPalette = buildPalette();
    if (trackMesh) trackMesh.material.color.setHex(currentPalette.track);
    rebuildGauge(gaugeData, currentPalette);
  }
}

function toggleTheme() {
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  gsap.fromTo('#theme-btn', { scale: 0.88 }, { scale: 1, duration: 0.32, ease: 'back.out(2)' });
  applyTheme(next);
}

(function initTheme() {
  const saved = localStorage.getItem('rw-theme');
  applyTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
})();

// ── Three.js gauge ─────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: gaugeCanvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(190, 190);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
camera.position.set(0, 0.3, 5.2);
camera.lookAt(0, -0.06, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
keyLight.position.set(2, 4, 6);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x88aaff, 0.32);
fillLight.position.set(-3, -2, 4);
scene.add(fillLight);

const START = -Math.PI * 0.75;
const RANGE = Math.PI * 1.5;
const IR = 0.565, OR = 0.825;

let trackMesh = null;
let arcs      = { active: null, wired: null, compressed: null, free: null };
let gaugeData = { active: 0, wired: 0, compressed: 0, free: 0, total: 16 };

function arcShape(ir, or, a0, a1) {
  const s = new THREE.Shape();
  const N = 72;
  for (let i = 0; i <= N; i++) {
    const a = a0 + (a1 - a0) * i / N;
    i === 0 ? s.moveTo(Math.cos(a) * or, Math.sin(a) * or)
             : s.lineTo(Math.cos(a) * or, Math.sin(a) * or);
  }
  for (let i = N; i >= 0; i--) {
    const a = a0 + (a1 - a0) * i / N;
    s.lineTo(Math.cos(a) * ir, Math.sin(a) * ir);
  }
  s.closePath();
  return s;
}

function makeArc(hexColor, a0, a1) {
  const geo = new THREE.ExtrudeGeometry(arcShape(IR, OR, a0, a1), {
    depth: 0.11, bevelEnabled: true,
    bevelThickness: 0.022, bevelSize: 0.013, bevelSegments: 4, curveSegments: 12,
  });
  const mat = new THREE.MeshStandardMaterial({ color: hexColor, metalness: 0.08, roughness: 0.36 });
  return new THREE.Mesh(geo, mat);
}

function initTrack(pal) {
  if (trackMesh) scene.remove(trackMesh);
  const geo = new THREE.ShapeGeometry(arcShape(IR - 0.004, OR + 0.004, START, START + RANGE), 72);
  const mat = new THREE.MeshBasicMaterial({ color: pal.track, side: THREE.DoubleSide });
  trackMesh = new THREE.Mesh(geo, mat);
  trackMesh.position.z = -0.02;
  scene.add(trackMesh);
}

function rebuildGauge(d, pal) {
  Object.values(arcs).forEach(m => m && scene.remove(m));
  const total = d.total || 1;
  let cursor = START;
  for (const [key, gb] of [['active', d.active], ['wired', d.wired], ['compressed', d.compressed], ['free', d.free]]) {
    const sweep = RANGE * (gb / total);
    if (sweep < 0.002) { arcs[key] = null; continue; }
    arcs[key] = makeArc(pal[key], cursor, cursor + sweep);
    scene.add(arcs[key]);
    cursor += sweep;
  }
  renderer.render(scene, camera);
}

currentPalette = buildPalette();
initTrack(currentPalette);
gaugeReady = true;
rebuildGauge(gaugeData, currentPalette);

function animateGauge(next) {
  gsap.to(gaugeData, {
    active: next.active, wired: next.wired,
    compressed: next.compressed, free: next.free, total: next.total,
    duration: 0.8, ease: 'power2.out',
    onUpdate: () => rebuildGauge(gaugeData, currentPalette),
  });
}

// ── SSE + reconnect ─────────────────────────────────────────────────────────
let firstLoad     = true;
let killableProcs = [];

const tbody   = document.getElementById('proc-body');
const rowMap  = new Map();
const connDot = document.getElementById('conn-dot');
const connLbl = document.getElementById('conn-label');

function setConnState(state) {
  connDot.className = 'conn-dot' + (state === 'warn' ? ' warn' : state === 'error' ? ' error' : '');
  connLbl.textContent = state === 'ok' ? 'Live' : state === 'warn' ? 'Reconnecting…' : 'Disconnected';
}

function connectSSE() {
  setConnState('warn');
  const sse = new EventSource('/api/stream');
  sse.onopen    = () => setConnState('ok');
  sse.onmessage = e => {
    const data = JSON.parse(e.data);
    updateHeader(data);
    updateTable(data.processes || []);
  };
  sse.onerror = () => {
    setConnState('error');
    sse.close();
    setTimeout(connectSSE, 3000);
  };
}

connectSSE();

// ── Helpers ──────────────────────────────────────────────────────────────────
function fmt1(n) { return Number(n).toFixed(1); }

function fmtAge(s) {
  if (s < 60)    return s + 's';
  if (s < 3600)  return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Header ──────────────────────────────────────────────────────────────────
function updateHeader(data) {
  document.getElementById('s-used-num').textContent = fmt1(data.used_gb);
  document.getElementById('s-free').textContent     = fmt1(data.free_gb);
  document.getElementById('s-total').textContent    = fmt1(data.total_gb);

  const pStr = (data.pressure || '').toLowerCase();
  const pEl  = document.getElementById('pressure-pill');
  pEl.textContent = data.pressure || 'Normal';
  pEl.className   = 'pressure-pill ' + (
    pStr.includes('critical') ? 'pressure-critical' :
    pStr.includes('warn')     ? 'pressure-warn'     : 'pressure-normal');

  const pct = data.total_gb > 0 ? Math.round(data.used_gb / data.total_gb * 100) : 0;
  document.getElementById('gauge-pct').textContent = pct + '%';

  // /audit: update canvas aria-label with full segment breakdown
  gaugeCanvas.setAttribute('aria-label',
    `Memory gauge: ${pct}% used — Active ${fmt1(data.active_gb || 0)} GB, ` +
    `Wired ${fmt1(data.wired_gb || 0)} GB, ` +
    `Compressed ${fmt1(data.compressed_gb || 0)} GB, ` +
    `Free ${fmt1(data.free_gb || 0)} GB`);

  // Color hero Used number by pressure level
  const usedRow = document.getElementById('s-used-row');
  usedRow.style.color = pStr.includes('critical') ? 'var(--safe-kill)' :
                        pStr.includes('warn')     ? 'var(--auto-restart)' : '';

  animateGauge({
    active:     data.active_gb     || 0,
    wired:      data.wired_gb      || 0,
    compressed: data.compressed_gb || 0,
    free:       data.free_gb       || 0,
    total:      data.total_gb      || 16,
  });
}

// ── Table ────────────────────────────────────────────────────────────────────
function badgeFor(sc) {
  if (sc === 'safe-to-kill') return '<span class="badge badge-safe">Safe</span>';
  // /clarify: "Auto-restart" with tooltip explaining the behavior
  if (sc === 'auto-restart') return '<span class="badge badge-restart" title="Claude will restart this automatically">Auto-restart</span>';
  return '<span class="badge badge-system">System</span>';
}

function actionsFor(p) {
  if (p.safety_class === 'system') return '';
  const isChroma = p.name === 'uvx' || (p.name || '').includes('chroma');
  let h = `<button class="btn btn-kill" onclick="killProc(${p.pid},this)" aria-label="Kill ${esc(p.name)} PID ${p.pid}">Kill</button>`;
  if (isChroma)
    h += `<button class="btn btn-restart" onclick="restartChroma(${p.pid},this)" aria-label="Restart ChromaDB">Restart</button>`;
  return h;
}

function updateTable(procs) {
  killableProcs = procs.filter(p => p.safety_class === 'safe-to-kill');
  const freeableGB  = killableProcs.reduce((s, p) => s + p.ram_mb, 0) / 1024;
  const hasKillable = killableProcs.length > 0;

  const freeableRow = document.getElementById('s-freeable-row');
  document.getElementById('s-freeable-num').textContent = hasKillable ? fmt1(freeableGB) : '—';
  freeableRow.classList.toggle('none', !hasKillable);

  const batchBtn = document.getElementById('batch-kill-btn');
  document.getElementById('batch-gb').textContent = hasKillable ? fmt1(freeableGB) : '—';
  batchBtn.disabled = !hasKillable;

  if (!procs.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-cell">No processes found.</td></tr>';
    rowMap.clear();
    return;
  }

  // /clarify: recalculate maxRAM from current tick — bars re-normalize after kills
  const maxRAM = procs.length > 0 ? Math.max(...procs.map(p => p.ram_mb)) : 1;
  const seen   = new Set(procs.map(p => p.pid));

  for (const [pid, tr] of rowMap) {
    if (!seen.has(pid)) {
      gsap.to(tr, {
        opacity: 0, x: -18, duration: 0.26, ease: 'power2.in',
        onComplete: () => { tr.remove(); rowMap.delete(pid); },
      });
    }
  }

  procs.forEach((p, idx) => {
    let tr = rowMap.get(p.pid);
    const barPct = Math.min(100, p.ram_mb / maxRAM * 100).toFixed(1);

    if (!tr) {
      tr = document.createElement('tr');
      tr.dataset.pid = p.pid;
      tbody.appendChild(tr);
      rowMap.set(p.pid, tr);
      if (firstLoad) {
        tr.style.opacity = '0';
        gsap.to(tr, { opacity: 1, duration: 0.24, delay: idx * 0.02, ease: 'power2.out' });
      } else {
        gsap.fromTo(tr, { opacity: 0, x: 8 }, { opacity: 1, x: 0, duration: 0.24, ease: 'power2.out' });
      }
    }

    if (tr.dataset.killing) return;

    tr.innerHTML = `
      <td class="col-name" title="${esc(p.command || p.name)}">${esc(p.name)}</td>
      <td class="col-ram">
        <div class="ram-bar-wrap">
          <div class="ram-bar-bg"><div class="ram-bar-fill" style="width:${barPct}%"></div></div>
          <span class="ram-label">${Math.round(p.ram_mb)} MB</span>
        </div>
      </td>
      <td class="col-meta">
        ${fmtAge(p.age_secs)}<span class="meta-sep">·</span>${p.pid}
      </td>
      <td>${badgeFor(p.safety_class)}</td>
      <td class="col-actions">${actionsFor(p)}</td>`;
  });

  if (firstLoad) firstLoad = false;
}

// ── Kill ─────────────────────────────────────────────────────────────────────
async function killProc(pid, btn) {
  const tr   = btn.closest('tr');
  const name = tr.querySelector('.col-name')?.textContent || String(pid);
  tr.dataset.killing = '1';
  btn.disabled = true;

  tr.classList.add('row-flash');
  setTimeout(() => tr.classList.remove('row-flash'), 340);
  await new Promise(r => setTimeout(r, 160));

  try {
    const res = await fetch(`/api/kill/${pid}`, { method: 'POST' });
    if (res.ok) {
      // /audit: move focus to next row's kill button or batch kill before removing
      const allRows    = [...tbody.querySelectorAll('tr:not([data-killing])')];
      const currentIdx = allRows.indexOf(tr);
      const nextFocus  = allRows[currentIdx + 1]?.querySelector('.btn') ||
                         allRows[currentIdx - 1]?.querySelector('.btn') ||
                         document.getElementById('batch-kill-btn');

      rowMap.delete(pid);
      gsap.to(tr, {
        opacity: 0, x: -20, duration: 0.26, ease: 'power2.in',
        onComplete: () => {
          tr.remove();
          nextFocus?.focus();
        },
      });
      showToast(`Killed ${name}`);
    } else {
      delete tr.dataset.killing;
      btn.disabled = false;
      showKillError(btn, (await res.text()) || 'Kill failed');
    }
  } catch {
    delete tr.dataset.killing;
    btn.disabled = false;
    showKillError(btn, 'Request failed');
  }
}

function showKillError(btn, msg) {
  btn.parentElement.querySelector('.btn-kill-err')?.remove();
  const span = document.createElement('span');
  span.className = 'btn-kill-err';
  span.textContent = msg;
  btn.after(span);
  setTimeout(() => span.remove(), 3000);
}

async function restartChroma(pid, btn) {
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '…';
  gsap.fromTo(btn, { scale: 0.92 }, { scale: 1, duration: 0.28, ease: 'power2.out' });
  try {
    const res = await fetch('/api/restart/chroma', { method: 'POST' });
    if (res.ok) {
      showToast('ChromaDB restarted');
    } else {
      btn.textContent = 'Failed';
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
      return;
    }
  } catch {
    btn.textContent = 'Error';
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
    return;
  }
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
}

// ── Batch kill ────────────────────────────────────────────────────────────────
async function batchKill() {
  const btn     = document.getElementById('batch-kill-btn');
  const targets = [...killableProcs];
  if (!targets.length) return;
  btn.disabled = true;

  const totalGB = fmt1(targets.reduce((s, p) => s + p.ram_mb, 0) / 1024);
  let killed = 0;

  await Promise.all(targets.map(async p => {
    try {
      const res = await fetch(`/api/kill/${p.pid}`, { method: 'POST' });
      if (res.ok) {
        killed++;
        const tr = rowMap.get(p.pid);
        if (tr) {
          rowMap.delete(p.pid);
          gsap.to(tr, {
            opacity: 0, x: -20, duration: 0.24, ease: 'power2.in',
            onComplete: () => tr.remove(),
          });
        }
      }
    } catch { /* per-process silent */ }
  }));

  if (killed > 0) showToast(`Freed ~${totalGB} GB — killed ${killed} process${killed !== 1 ? 'es' : ''}`);
  else showToast('No processes could be killed', 2500);
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg, duration = 2800) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  gsap.fromTo(toast, { opacity: 0, y: -6 }, {
    opacity: 1, y: 0, duration: 0.22, ease: 'power2.out',
    onComplete: () => setTimeout(() => {
      gsap.to(toast, { opacity: 0, y: -4, duration: 0.18, ease: 'power2.in',
        onComplete: () => toast.remove() });
    }, duration),
  });
}

// ── Keyboard shortcut: F = batch kill ────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'f' || e.key === 'F') {
    const btn = document.getElementById('batch-kill-btn');
    if (!btn.disabled) {
      gsap.fromTo(btn, { scale: 0.95 }, { scale: 1, duration: 0.28, ease: 'back.out(1.4)' });
      batchKill();
    }
  }
});

// ── Button press spring ───────────────────────────────────────────────────────
document.addEventListener('mousedown', e => {
  const b = e.target.closest('.btn, .btn-batch, .theme-btn');
  if (b && !b.disabled) gsap.to(b, { scale: 0.93, duration: 0.08 });
});
document.addEventListener('mouseup', e => {
  const b = e.target.closest('.btn, .btn-batch, .theme-btn');
  if (b) gsap.to(b, { scale: 1, duration: 0.28, ease: 'back.out(1.4)' });
});

// ── Reduced motion ────────────────────────────────────────────────────────────
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  gsap.globalTimeline.timeScale(0);
}
</script>
